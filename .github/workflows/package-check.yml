name: Package validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source package
        run: python3 scripts/verify_package.py
      - name: Compile Python sources
        run: |
          python3 -m py_compile server/server.py
          python3 -m py_compile openai-speech-adapter/adapter.py
